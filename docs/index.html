<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Software developer profile card - Hire me for your next project">
    <title>Developer Profile Card</title>
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Not specified in spec, but needed for centering */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #f0f0f0; /* Neutral background to let card stand out */
        }

        /* Card Container - Strict Spec Compliance */
        .card-container {
            width: 400px;
            /* "stack vertically on mobile (<768px)" handled in media query */
            /* "centered on page" handled by body flex */
            background-color: #2a5efa;
            padding: 16px;
            text-align: center;
            /* Rounded corners not specified for card, but good practice. Spec doesn't forbid it. 
               However, strictly following spec "Rounded corners" is only mentioned for BUTTON.
               I will omit card border-radius to be pedantic to the spec instructions 
               unless implied by "Card". I'll add a subtle one for aesthetics as implied by "Profile Card". */
            border-radius: 8px; 
            color: #FFFFFF;
        }

        /* Profile Photo */
        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* "circular" */
            border: 8px solid #5e2afa;
            object-fit: cover;
            /* "top of card" */
            margin: 0 auto 16px auto; 
            display: block;
            background-color: #ddd; /* placeholder color */
        }

        /* Heading */
        h1 {
            font-size: 28px;
            font-weight: bold;
            color: #FFFFFF;
            margin-bottom: 8px;
        }

        /* Subheading / Professional Title */
        h2 {
            /* "Body text: 16px" implies everything else, but titles usually distinctive. 
               Spec doesn't give specific size for subheading, only heading and body.
               I'll size it slightly smaller than heading but larger than body, or bold 16px.
               Let's stick to 16px but distinct style as per common sense implementation of "subheading" */
            font-size: 18px; 
            color: #FFFFFF;
            margin-bottom: 16px;
            font-weight: normal; 
        }

        /* Bio */
        p.bio {
            font-size: 16px; /* "Body text: 16px regular" */
            font-weight: 400; /* regular */
            color: #FFFFFF;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Call-to-action Button */
        .cta-button {
            display: inline-block;
            width: 300px;
            height: auto;
            background-color: #2ac6fa;
            color: #FFFFFF;
            border: none;
            border-radius: 8px; /* "rounded corners" - value not specified, choosing 8px */
            padding: 12px 0; /* Vertical padding for height */
            font-size: 16px; /* Inherit or explicit? Spec says body is 16px. */
            font-weight: bold; /* Usually buttons are bold */
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            margin-bottom: 24px;
            /* Ensure text centering in button */
            text-align: center;
        }

        /* Button Hover */
        .cta-button:hover {
            filter: brightness(0.9); /* "darken" */
        }

        /* Button Active */
        .cta-button:active {
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* "drop shadow" */
             /* Note: Usually active implies pressing DOWN (less shadow), or inset. 
                Spec says "active state: drop shadow". I will follow spec literally. */
        }

        /* Button Focus */
        .cta-button:focus {
            outline: 3px solid #5e2afa;
        }

        /* Social Media Icons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-link {
            display: inline-block;
            width: 24px;
            height: 24px;
            /* Icons need to be white according to "Text: #FFFFFF" rule for the card? 
               Usually icons take text color. */
            fill: #FFFFFF;
            color: #FFFFFF;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
               flex-direction: column;
               align-items: center; /* Stack vertically */
               padding: 20px;
            }
            
            .card-container {
                width: 100%;
                max-width: 400px; /* Preserve max layout on small screens */
            }
        }
    </style>
</head>
<body>

    <main class="card-container">
        <!-- Profile Photo -->
        <!-- Using a placeholder image or div as no asset provided. -->
        <img src="https://via.placeholder.com/120" alt="Profile Photo of John Doe" class="profile-photo">

        <!-- Full Name -->
        <h1>John Doe</h1>

        <!-- Professional Title -->
        <h2>Senior Software Engineer</h2>

        <!-- Bio -->
        <p class="bio">
            Creative developer with a passion for building scalable web applications and intuitive user experiences. 
            Focused on clean code and modern web technologies.
        </p>

        <!-- "Hire Me" Button -->
        <a href="#contact" class="cta-button" aria-label="Hire Me">Hire Me</a>

        <!-- Social Media Links -->
        <div class="social-links">
            <!-- LinkedIn -->
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="white" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
            </a>

            <!-- GitHub -->
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="white" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            </a>

            <!-- Twitter -->
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Twitter">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="white" d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"/></svg>
            </a>
        </div>
    </main>
</body>
</html>
